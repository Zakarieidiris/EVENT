<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SOMALILAND NIGHT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#A8720A;--gold2:#C9921A;--gold-light:#F5E4B8;--gold-bg:#FDF7EC;
  --surface:#FAF8F4;--white:#FFFFFF;--card:#FFFFFF;--card2:#F5F2EC;
  --border:#E8E0D0;--border2:#D8CEBC;
  --ink:#1C1409;--ink2:#3D2F12;--text2:#7A6540;--text3:#A8957A;
  --green:#1E7A45;--green-bg:#EAF7EF;--green-border:#B8E0CA;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Barlow',sans-serif;
  background:var(--surface);color:var(--ink);
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 80% 0%,rgba(212,168,67,.07),transparent),
    radial-gradient(ellipse 50% 30% at 0% 100%,rgba(212,168,67,.05),transparent);
}

/* HEADER */
.hdr{
  position:relative;z-index:10;flex-shrink:0;
  padding:16px 20px 13px;
  border-bottom:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--white);
  box-shadow:0 1px 0 var(--border);
}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-name{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--ink);
}
.hdr-sub{font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-top:1px}
.hdr-count{text-align:right}
.hdr-count-num{
  font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;
  color:var(--gold2);line-height:1;
}
.hdr-count-lbl{font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase}

/* SCREEN */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1;-webkit-overflow-scrolling:touch;background:var(--surface)}
.panel{display:none;padding:20px 16px 100px;animation:fadeUp .3s ease both}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* NAV */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(20px);
  border-top:1.5px solid var(--border);
  display:flex;z-index:100;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -4px 20px rgba(28,20,9,.06);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 4px 11px;gap:4px;cursor:pointer;border:none;background:none;
  color:var(--text3);transition:color .2s;position:relative;
}
.nav-btn.active{color:var(--gold2)}
.nav-btn.active::before{
  content:'';position:absolute;top:0;left:22%;right:22%;
  height:2px;background:var(--gold2);border-radius:0 0 2px 2px;
}
.nav-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}

/* SECTION LABEL */
.sec-label{
  font-family:'Barlow Condensed',sans-serif;font-size:10px;
  letter-spacing:3px;text-transform:uppercase;color:var(--text3);
  margin-bottom:18px;display:flex;align-items:center;gap:10px;
}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* FORM */
.form-group{margin-bottom:18px}
.form-label{
  display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--text3);margin-bottom:8px;font-weight:600;
}
.form-input{
  width:100%;padding:13px 16px;
  background:var(--white);border:1.5px solid var(--border2);border-radius:10px;
  font-family:'Barlow',sans-serif;font-size:15px;color:var(--ink);
  outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;
}
.form-input::placeholder{color:var(--text3)}

/* TICKET TYPE PILLS */
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.type-pill{
  padding:12px 4px 10px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--white);cursor:pointer;text-align:center;transition:all .2s;
}
.type-pill.sel{border-color:var(--gold2);background:var(--gold-bg);box-shadow:0 2px 12px rgba(169,114,10,.12)}
.type-pill-icon{font-size:22px;margin-bottom:5px}
.type-pill-name{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:var(--text3)}
.type-pill.sel .type-pill-name{color:var(--gold)}

.btn-gen{
  width:100%;padding:16px;border-radius:12px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#8A5E08,#C9921A,#8A5E08);background-size:200% 100%;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
  letter-spacing:3px;text-transform:uppercase;color:white;
  box-shadow:0 4px 18px rgba(169,114,10,.3);
}

/* SCANNER UI */
.scan-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{
  background:var(--white);border:1.5px solid var(--border);border-radius:12px;
  padding:14px;text-align:center;
}
.stat-num{
  font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;
  color:var(--gold2);line-height:1;margin-bottom:4px;
}
.stat-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);font-weight:600}

.scanner-wrap{
  border-radius:16px;overflow:hidden;border:1.5px solid var(--border2);
  background:#000;position:relative;margin-bottom:14px;
}
#reader{width:100%!important}
.scan-beam{
  position:absolute;left:14px;right:14px;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--gold2) 30%,#F5D78E 50%,var(--gold2) 70%,transparent);
  box-shadow:0 0-10px var(--gold2);
  animation:beam 2.8s ease-in-out infinite;z-index:6;
}
@keyframes beam{0%,100%{top:14px}50%{top:calc(100% - 14px)}}

.cooldown-overlay{
  position:absolute;inset:0;z-index:10;
  background:rgba(0,0,0,.88);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.cooldown-overlay.on{opacity:1;pointer-events:all}

/* MODAL */
.overlay{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
  background:rgba(28,20,9,.5);backdrop-filter:blur(8px);
}
.overlay.show{opacity:1;pointer-events:all}
.modal{
  width:100%;max-width:480px;border-radius:24px 24px 0 0;
  padding-bottom:calc(env(safe-area-inset-bottom) + 20px);
  transform:translateY(100%);transition:transform .38s cubic-bezier(.32,1.1,.64,1);
  background:white;
}
.overlay.show .modal{transform:translateY(0)}
.m-hero{padding:22px 20px 16px;text-align:center}
.m-name{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;margin-bottom:6px}
.m-badge{
  display:inline-flex;padding:5px 14px;border-radius:20px;
  font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
}
.b-nm{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.b-vp{background:#FDE8A0;color:var(--gold);border:1px solid #D4A843}

.btn-confirm{
  width:90%;margin:10px auto;padding:17px;border-radius:14px;border:none;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;
  letter-spacing:3px;text-transform:uppercase;color:white;display:block;
}
.c-nm{background:var(--green)}
.c-vp{background:var(--gold2)}
.btn-skip{width:100%;padding:11px;border:none;background:none;color:var(--text3);cursor:pointer}

/* GUEST LIST */
.gl-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);background:white}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-left">
    <div>
      <div class="hdr-name">Somaliland Night</div>
      <div class="hdr-sub">Entry Management</div>
    </div>
  </div>
  <div class="hdr-count">
    <div class="hdr-count-num" id="scan-count">0</div>
    <div class="hdr-count-lbl">Checked In</div>
  </div>
</header>

<div class="screen">
  <div class="panel active" id="panel-scanner">
    <div class="scan-stats">
      <div class="stat-box">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-lbl">Total Scanned</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-vip">0</div>
        <div class="stat-lbl">VIP Entries</div>
      </div>
    </div>
    <div class="scanner-wrap">
      <div id="reader"></div>
      <div class="scan-beam"></div>
      <div class="cooldown-overlay" id="cooldown">
        <div style="color:white;letter-spacing:2px">SCANNING...</div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-generate">
    <div class="sec-label">New Ticket</div>
    <div class="form-group">
      <label class="form-label">Name</label>
      <input class="form-input" type="text" id="f-name" placeholder="Full name...">
    </div>
    <div class="type-grid">
      <div class="type-pill sel" data-val="Normal Guest" onclick="selType(this)">GUEST</div>
      <div class="type-pill" data-val="VIP" onclick="selType(this)">VIP</div>
      <div class="type-pill" data-val="VIP WITH DINNER" onclick="selType(this)">VIP+D</div>
    </div>
    <button class="btn-gen" onclick="generateQR()">Generate</button>
    <div id="qr-output" style="text-align:center;margin-top:20px">
      <div id="qr-canvas" style="display:flex;justify-content:center"></div>
    </div>
  </div>

  <div class="panel" id="panel-guestlist">
    <div class="sec-label">Recent Entries</div>
    <div id="full-list"></div>
  </div>
</div>

<nav class="nav">
  <button class="nav-btn active" onclick="switchTab('scanner',this)">SCAN</button>
  <button class="nav-btn" onclick="switchTab('generate',this)">CREATE</button>
  <button class="nav-btn" onclick="switchTab('guestlist',this)">LIST</button>
</nav>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="m-hero">
      <div class="m-name" id="m-name"></div>
      <div class="m-badge" id="m-badge"></div>
    </div>
    <button class="btn-confirm" id="m-ok" onclick="confirmScan()">Confirm Entry</button>
    <button class="btn-skip" onclick="dismissScan()">Dismiss</button>
  </div>
</div>

<script>
let scanner=null, cooling=false, pending=null;
let total=parseInt(localStorage.getItem('sl_scans')||'0');
let log=JSON.parse(localStorage.getItem('sl_log')||'[]');
let _ctx=null;

// --- AUDIO & HAPTIC ENGINE ---
function getCtx() {
  if(!_ctx) _ctx=new(window.AudioContext||window.webkitAudioContext)();
  if(_ctx.state==='suspended') _ctx.resume();
  return _ctx;
}

function playBeep(type) {
  try {
    const c=getCtx(), o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(c.destination);
    if(type==='vip') {
      o.frequency.setValueAtTime(880, c.currentTime);
      o.frequency.setValueAtTime(1100, c.currentTime+0.1);
      g.gain.setValueAtTime(0.5, c.currentTime);
      o.start(); o.stop(c.currentTime+0.3);
    } else {
      o.frequency.setValueAtTime(660, c.currentTime);
      g.gain.setValueAtTime(0.4, c.currentTime);
      o.start(); o.stop(c.currentTime+0.2);
    }
  } catch(e){}
}

function buzz(type) {
  if(navigator.vibrate) {
    if(type==='vip') navigator.vibrate([100, 50, 100]);
    else navigator.vibrate(150);
  }
}

// --- CORE APP LOGIC ---
document.getElementById('scan-count').textContent=total;
document.getElementById('stat-total').textContent=total;
startScanner();

function selType(el){
  document.querySelectorAll('.type-pill').forEach(p=>p.classList.remove('sel'));
  el.classList.add('sel'); 
  window.selTypeVal=el.dataset.val;
}

function generateQR(){
  const name=document.getElementById('f-name').value;
  const val=window.selTypeVal||'Normal Guest';
  const c=document.getElementById('qr-canvas'); c.innerHTML='';
  new QRCode(c,{text:JSON.stringify({n:name,t:val}),width:180,height:180});
}

function switchTab(id,el){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  if(id==='scanner') startScanner(); else stopScanner();
  if(id==='guestlist') renderList();
}

function startScanner(){
  if(scanner) return;
  scanner=new Html5Qrcode('reader');
  scanner.start({facingMode:'environment'},{fps:10,qrbox:250},txt=>{
    if(cooling) return;
    cooling=true;
    try{
      pending=JSON.parse(txt);
      document.getElementById('cooldown').classList.add('on');
      setTimeout(openModal, 500);
    }catch(e){cooling=false;}
  });
}

function stopScanner(){if(scanner){scanner.stop();scanner=null;}}

function openModal(){
  const isVip=pending.t!=='Normal Guest';
  document.getElementById('m-name').textContent=pending.n;
  const b=document.getElementById('m-badge');
  b.textContent=pending.t;
  b.className='m-badge '+(isVip?'b-vp':'b-nm');
  document.getElementById('m-ok').className='btn-confirm '+(isVip?'c-vp':'c-nm');
  document.getElementById('overlay').classList.add('show');
}

function confirmScan(){
  const isVip=pending.t!=='Normal Guest';
  
  // TRIGGER HAPTIC AND SOUND
  buzz(isVip?'vip':'normal');
  playBeep(isVip?'vip':'normal');

  total++;
  log.unshift({n:pending.n, t:pending.t, time:new Date().toLocaleTimeString()});
  localStorage.setItem('sl_scans', total);
  localStorage.setItem('sl_log', JSON.stringify(log));
  
  document.getElementById('scan-count').textContent=total;
  document.getElementById('stat-total').textContent=total;
  document.getElementById('stat-vip').textContent=log.filter(g=>g.t!=='Normal Guest').length;
  
  closeModal();
}

function dismissScan(){ closeModal(); }
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  setTimeout(()=>{
    document.getElementById('cooldown').classList.remove('on');
    cooling=false;
  },1000);
}

function renderList(){
  const el=document.getElementById('full-list');
  el.innerHTML=log.map(g=>`
    <div class="gl-row">
      <div style="flex:1"><b>${g.n}</b><br><small>${g.t}</small></div>
      <div style="font-size:10px">${g.time}</div>
    </div>`).join('');
}
</script>
</body>
</html>
