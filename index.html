<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhacdooyinka — QR System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9921A; --ink:#1A1209; --ink2:#3D2B0A; --muted:#7A6540;
  --surface:#FFFDF7; --border:#D4B97A; --green:#1A7A3D;
}
body{font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--ink);min-height:100vh}

.header{background:var(--ink);padding:1rem 1.5rem;display:flex;align-items:center;gap:12px}
.header-logo{width:40px;height:40px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink);font-weight:800}
.header-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.15rem;color:white}

.tabs{display:flex;background:var(--ink2);padding:0 1rem;border-bottom:2px solid var(--gold)}
.tab{padding:1rem;font-family:'Syne',sans-serif;font-weight:600;font-size:13px;color:#8A7A5A;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab.active{color:var(--gold);border-bottom:3px solid var(--gold)}

.content{padding:1.5rem;max-width:600px;margin:0 auto;width:100%}
.panel{display:none}
.panel.active{display:block}

.card{background:white;border:1.5px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem;text-align:center}
input, select{width:100%;padding:0.8rem;border:1px solid #ddd;border-radius:8px;margin:10px 0 20px;font-family:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0.8rem;border-radius:8px;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;border:none;width:100%;transition:0.2s}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-outline{background:transparent;border:1.5px solid var(--gold);color:var(--gold);margin-top:10px}

#reader { width: 100% !important; border-radius: 12px; overflow: hidden; background: #000; }
.scan-result { padding: 1.5rem; border-radius: 12px; margin-top: 15px; display: none; animation: slideIn 0.3s ease; }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="header">
    <div class="header-logo">QR</div>
    <div class="header-title">Dhacdooyinka</div>
</div>

<div class="tabs">
    <div class="tab active" onclick="switchTab('generate')"><i class="ti ti-qrcode"></i> 1. Create QR</div>
    <div class="tab" onclick="switchTab('scanner')"><i class="ti ti-scan"></i> 2. Scan QR</div>
</div>

<div class="content">
    <div class="panel active" id="panel-generate">
        <div class="card">
            <h3 style="font-family:Syne;margin-bottom:15px">Create New Ticket</h3>
            <label style="font-size:12px;text-transform:uppercase;font-weight:700;color:var(--muted)">Attendee Name</label>
            <input type="text" id="f-name" placeholder="Enter Full Name">
            
            <label style="font-size:12px;text-transform:uppercase;font-weight:700;color:var(--muted)">Ticket Class</label>
            <select id="f-type">
                <option value="General">General Admission</option>
                <option value="VIP">VIP Access</option>
                <option value="Staff">Staff / Crew</option>
            </select>
            
            <button class="btn btn-gold" onclick="generateQR()">
                <i class="ti ti-plus"></i> Generate Ticket
            </button>
        </div>

        <div class="card" id="qr-output" style="display:none">
            <div id="qr-canvas" style="display:flex;justify-content:center;margin-bottom:1rem"></div>
            <h2 id="t-name" style="font-family:Syne;color:var(--ink2)"></h2>
            <p id="t-type" style="color:var(--muted);font-weight:700;margin-bottom:15px"></p>
            <button class="btn btn-outline" onclick="window.print()">
                <i class="ti ti-printer"></i> Print or Save Ticket
            </button>
        </div>
    </div>

    <div class="panel" id="panel-scanner">
        <div class="card" style="padding:10px; background:#000">
            <div id="reader"></div>
        </div>
        
        <div id="scan-result" class="scan-result">
            <i class="ti ti-circle-check" style="font-size:40px;color:var(--green)"></i>
            <h2 id="res-name" style="font-family:Syne;margin:10px 0 5px"></h2>
            <p id="res-type" style="text-transform:uppercase;letter-spacing:1px;font-size:13px"></p>
            <div style="margin-top:15px;padding-top:15px;border-top:1px solid rgba(0,0,0,0.1);font-size:12px;color:var(--muted)">
                Ticket Verified Successfully
            </div>
        </div>
    </div>
</div>

<script>
let html5QrCode = null;

function switchTab(id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.currentTarget.classList.add('active');
    
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
    
    // Manage Camera
    if(id === 'scanner') {
        startScanner();
    } else {
        if(html5QrCode) html5QrCode.stop();
        document.getElementById('scan-result').style.display = 'none';
    }
}

function generateQR() {
    const name = document.getElementById('f-name').value.trim();
    const type = document.getElementById('f-type').value;
    
    if(!name) { alert("Please enter a name"); return; }

    // Store data inside the QR string as JSON
    const qrData = JSON.stringify({ n: name, t: type });

    document.getElementById('qr-output').style.display = 'block';
    document.getElementById('t-name').textContent = name;
    document.getElementById('t-type').textContent = type + " TICKET";
    
    const canvas = document.getElementById('qr-canvas');
    canvas.innerHTML = "";
    new QRCode(canvas, {
        text: qrData,
        width: 200,
        height: 200,
        colorDark: "#1A1209",
        colorLight: "#ffffff"
    });
    
    // Scroll to view
    document.getElementById('qr-output').scrollIntoView({behavior:'smooth'});
}

function startScanner() {
    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
        try {
            // Parse the data from the QR code
            const data = JSON.parse(decodedText);
            showResult(data);
            
            // Success sound
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.play();
        } catch(e) {
            alert("Invalid QR Code Format");
        }
    }).catch(err => {
        alert("Camera Access Required: " + err);
    });
}

function showResult(data) {
    const res = document.getElementById('scan-result');
    res.style.display = 'block';
    res.style.background = "#D4F0DF"; // Success Green
    res.style.border = "2px solid var(--green)";
    
    document.getElementById('res-name').textContent = data.n;
    document.getElementById('res-type').textContent = data.t;
}
</script>
</body>
</html>
