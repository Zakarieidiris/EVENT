<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Scanner — Somaliland Event</title>
<!-- jsQR for QR decoding from camera -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1e1e1e;
    --gold: #c9a84c;
    --gold-dim: #8a6f2e;
    --text: #e8e0d0;
    --muted: #444;
    --green: #3ddc84;
    --green-bg: #0d2e1a;
    --red: #ff4f4f;
    --red-bg: #2e0d0d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }

  .flag-bar {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .flag-seg {
    height: 3px;
    width: 32px;
    border-radius: 2px;
  }

  .label {
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 4vw, 34px);
    color: var(--gold);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 28px;
    width: 100%;
    max-width: 440px;
    margin-bottom: 16px;
  }

  .section-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* KEY INPUT */
  .key-row {
    display: flex;
    gap: 10px;
  }

  input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 11px 14px;
    border-radius: 1px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--gold-dim); }

  .btn {
    background: var(--gold);
    color: #000;
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 11px 18px;
    cursor: pointer;
    border-radius: 1px;
    font-weight: 500;
    white-space: nowrap;
    transition: opacity 0.2s;
  }

  .btn:hover { opacity: 0.85; }

  .btn-full {
    width: 100%;
    padding: 15px;
    font-size: 11px;
    letter-spacing: 3px;
    margin-top: 4px;
  }

  /* CAMERA */
  .camera-wrapper {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: 1px;
    overflow: hidden;
    aspect-ratio: 1 / 1;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  canvas { display: none; }

  .scan-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .scan-frame {
    width: 55%;
    height: 55%;
    border: 2px solid var(--gold);
    position: relative;
    border-radius: 2px;
  }

  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    top: 0;
    animation: scanMove 2s ease-in-out infinite;
  }

  @keyframes scanMove {
    0% { top: 0%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  .scan-corner {
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: var(--gold);
    border-style: solid;
  }

  .scan-corner.tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
  .scan-corner.tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
  .scan-corner.bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }
  .scan-corner.br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }

  .cam-status {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-align: center;
    margin-top: 12px;
    text-transform: uppercase;
    min-height: 18px;
  }

  /* RESULT */
  .result-box {
    display: none;
    border-radius: 2px;
    padding: 24px;
    text-align: center;
    animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    margin-bottom: 16px;
    width: 100%;
    max-width: 440px;
  }

  @keyframes pop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .result-box.valid {
    display: block;
    background: var(--green-bg);
    border: 1px solid var(--green);
  }

  .result-box.invalid {
    display: block;
    background: var(--red-bg);
    border: 1px solid var(--red);
  }

  .result-icon {
    font-size: 48px;
    margin-bottom: 10px;
    line-height: 1;
  }

  .result-status {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 16px;
  }

  .result-box.valid .result-status { color: var(--green); }
  .result-box.invalid .result-status { color: var(--red); }

  .result-detail {
    font-size: 11px;
    color: var(--muted);
    line-height: 2;
    text-align: left;
  }

  .result-detail span { color: var(--text); }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 1px;
    margin-top: 16px;
    transition: all 0.2s;
    width: 100%;
  }

  .reset-btn:hover { border-color: var(--gold-dim); color: var(--gold); }

  /* key status badge */
  .key-badge {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 10px;
    padding: 6px 10px;
    border-radius: 1px;
    display: none;
  }

  .key-badge.set {
    display: block;
    background: #0d2e1a;
    color: var(--green);
    border: 1px solid #1a4a2a;
  }

  .nav-hint {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-align: center;
    margin-top: 8px;
  }

  .nav-hint a {
    color: var(--gold-dim);
    text-decoration: none;
  }

  .nav-hint a:hover { color: var(--gold); }

  /* Manual paste area */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 12px 14px;
    border-radius: 1px;
    outline: none;
    resize: none;
    height: 60px;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: var(--gold-dim); }
</style>
</head>
<body>

<div class="header">
  <div class="flag-bar">
    <div class="flag-seg" style="background:#4a90d9;"></div>
    <div class="flag-seg" style="background:#ffffff;"></div>
    <div class="flag-seg" style="background:#4a90d9;"></div>
  </div>
  <div class="label">Somaliland Event System — Admin</div>
  <h1>Entrance Scanner</h1>
</div>

<!-- Key Setup -->
<div class="card">
  <div class="section-label">Step 1 — Set Secret Key</div>
  <div class="key-row">
    <input type="password" id="adminKey" placeholder="Enter the event secret key" />
    <button class="btn" onclick="setKey()">Set</button>
  </div>
  <div class="key-badge" id="keyBadge">✓ Secret key loaded</div>
</div>

<!-- Camera Scanner -->
<div class="card">
  <div class="section-label">Step 2 — Scan QR Code</div>
  <div class="camera-wrapper">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="scan-overlay">
      <div class="scan-frame">
        <div class="scan-line"></div>
        <div class="scan-corner tl"></div>
        <div class="scan-corner tr"></div>
        <div class="scan-corner bl"></div>
        <div class="scan-corner br"></div>
      </div>
    </div>
  </div>
  <div class="cam-status" id="camStatus">camera not started</div>
  <button class="btn btn-full" onclick="startCamera()" style="margin-top:16px;">Start Camera</button>

  <hr class="divider" />

  <div class="section-label">Or — Paste Token Manually</div>
  <textarea id="manualToken" placeholder="Paste QR token here..."></textarea>
  <button class="btn btn-full" onclick="validateManual()">Validate Token</button>
</div>

<!-- Result -->
<div class="result-box" id="resultBox">
  <div class="result-icon" id="resultIcon"></div>
  <div class="result-status" id="resultStatus"></div>
  <div class="result-detail" id="resultDetail"></div>
  <button class="reset-btn" onclick="resetScan()">Scan Next →</button>
</div>

<div class="nav-hint">
  ← <a href="../generate.html">Back to Generator</a>
</div>

<script>
let secretKey = '';
let scanning = false;
let stream = null;

// Auto-load key from localStorage if set during generation
window.addEventListener('load', () => {
  const saved = localStorage.getItem('eventSecret');
  if (saved) {
    document.getElementById('adminKey').value = saved;
    setKey(true);
  }
});

function setKey(silent = false) {
  const k = document.getElementById('adminKey').value.trim();
  if (!k) { alert('Please enter the secret key.'); return; }
  secretKey = k;
  document.getElementById('keyBadge').classList.add('set');
  if (!silent) document.getElementById('camStatus').textContent = 'key set — ready to scan';
}

async function startCamera() {
  if (!secretKey) { alert('Please set the secret key first.'); return; }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } }
    });
    const video = document.getElementById('video');
    video.srcObject = stream;
    video.play();
    scanning = true;
    document.getElementById('camStatus').textContent = 'scanning... point at QR code';
    requestAnimationFrame(tick);
  } catch (e) {
    document.getElementById('camStatus').textContent = 'camera access denied';
    alert('Could not access camera: ' + e.message);
  }
}

function tick() {
  if (!scanning) return;
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
    if (code && code.data) {
      scanning = false;
      stopCamera();
      validateToken(code.data);
      return;
    }
  }
  requestAnimationFrame(tick);
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

function validateManual() {
  if (!secretKey) { alert('Please set the secret key first.'); return; }
  const token = document.getElementById('manualToken').value.trim();
  if (!token) { alert('Please paste a token.'); return; }
  validateToken(token);
}

function validateToken(rawToken) {
  try {
    const tokenObj = JSON.parse(rawToken);
    if (!tokenObj.payload || !tokenObj.sig) throw new Error('Bad format');

    const payloadStr = atob(tokenObj.payload);
    const expectedSig = simpleHash(payloadStr + '|' + secretKey);

    if (tokenObj.sig !== expectedSig) {
      showResult(false, null, 'Signature mismatch — wrong key or tampered QR');
      return;
    }

    const payload = JSON.parse(payloadStr);
    showResult(true, payload);
  } catch (e) {
    showResult(false, null, 'Invalid or unreadable QR token');
  }
}

function showResult(valid, payload, errorMsg = '') {
  const box = document.getElementById('resultBox');
  box.className = 'result-box ' + (valid ? 'valid' : 'invalid');

  document.getElementById('resultIcon').textContent = valid ? '✓' : '✗';
  document.getElementById('resultStatus').textContent = valid ? 'Valid — Entry Allowed' : 'Invalid — Entry Denied';

  if (valid && payload) {
    const date = new Date(payload.d).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    document.getElementById('resultDetail').innerHTML = `
      <div>event &nbsp;&nbsp;&nbsp; <span>${payload.n}</span></div>
      <div>date &nbsp;&nbsp;&nbsp;&nbsp; <span>${date}</span></div>
      <div>time &nbsp;&nbsp;&nbsp;&nbsp; <span>${payload.t || '—'}</span></div>
      <div>venue &nbsp;&nbsp;&nbsp; <span>${payload.v}</span></div>
      <div>organizer <span>${payload.o || '—'}</span></div>
    `;
  } else {
    document.getElementById('resultDetail').innerHTML =
      `<div style="color: var(--red);">${errorMsg}</div>`;
  }

  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.getElementById('camStatus').textContent = valid ? 'scan complete' : 'scan failed';
}

function resetScan() {
  const box = document.getElementById('resultBox');
  box.className = 'result-box';
  document.getElementById('manualToken').value = '';
  document.getElementById('camStatus').textContent = 'ready — start camera to scan';
  scanning = false;
}

function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + c;
    hash |= 0;
  }
  return Math.abs(hash).toString(36);
}
</script>
</body>
</html>
